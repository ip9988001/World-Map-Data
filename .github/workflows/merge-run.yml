name: merge-run

# 独立合并任务：把某次采集运行的全部 norm-* 分片合并去重并切片。
# 可复用：任何一次 collect 运行结束后都能单独跑合并。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "要合并的采集运行 ID（collect-p0 的 run id）"
        required: true
      run_id2:
        description: "第二来源运行 ID（可选，用于把补跑结果并进来）"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下载采集分片（主运行）
        uses: actions/download-artifact@v4
        with:
          path: in/a
          pattern: norm-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载采集分片（补跑运行）
        if: ${{ github.event.inputs.run_id2 != '' }}
        uses: actions/download-artifact@v4
        with:
          path: in/b
          pattern: norm-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.run_id2 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ⛔ 2026-10-12：本步原先调用 collectors/merge_stream.py，已彻底剔除。
      # 该工具假设「输入已按整行排序 + key 是 JSON 首字段」——假设脆弱，破坏后会
      # **静默错误合并**（同地址留多条且不报错）。文件已移入 legacy/collectors/，
      # 合并统一走 scripts/build_release.py 的 TSV 契约（TAB 三列 key/prio/json + `sort -s`）。
      - name: 【已废弃】合并去重（原 merge_stream 路径）
        run: |
          echo "✗ 本步已废弃：collectors/merge_stream.py 已移入 legacy/，不再有任何调用点。"
          echo "  合并请走：python3 scripts/build_release.py --parsed parsed"
          exit 1

      - name: 摘要
        if: always()
        run: |
          python - <<'PY'
          import json, os, glob
          p = "out/merged/merge_report.json"
          if not os.path.exists(p):
              print("没有 merge_report.json"); raise SystemExit(0)
          d = json.load(open(p, encoding="utf-8"))
          print("唯一地址:", f"{d['去重后唯一记录']:,}")
          print("输入行数:", f"{d['输入行数']:,}", "| 重复:", f"{d['重复条数']:,}",
                "| 非法:", f"{d['非法行数']:,}", "| 多源交叉:", f"{d['多源交叉命中']:,}")
          print("覆盖州:", d["覆盖州数"])
          print("\n各州唯一地址数:")
          for s, n in d["按州"].items(): print(f"  {s:4s} {n:>12,}")
          sz = sum(os.path.getsize(f) for f in glob.glob("out/merged/by_state/*"))
          print(f"\n按州切片体积合计: {sz/1024/1024:.0f} MB")
          PY

      - name: 上传合并结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-final
          path: out/merged/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
