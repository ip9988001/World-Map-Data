name: reminders（凭证到期提醒）

# 为什么要放在 GitHub 上：本机（服务器）可能关机，这个定时任务在 GitHub 机器上跑，
# 到期前 7 天自动开一个 Issue —— GitHub 会给账号所有者发邮件，等于一条不会丢的提醒。
# 凭证本体**不进这个仓库**，只登记「有什么、什么时候到期、存在哪台机器的哪个路径」。

on:
  schedule:
    - cron: "0 3 * * *"        # 每天 UTC 03:00（北京 11:00）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 扫到期窗口并开提醒 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 - <<'PY' > /tmp/due.txt
          import csv, datetime
          today = datetime.date.today()
          rows = list(csv.DictReader(open("data/凭证到期.csv", encoding="utf-8-sig")))
          for r in rows:
              exp = datetime.date.fromisoformat((r.get("expires_on") or "").strip())
              days = (exp - today).days
              remind = int((r.get("remind_days") or "7").strip() or 7)
              print(f"{today.isoformat()}|{r.get('name','').strip()}|{exp}|{days}|{remind}|{(r.get('note') or '').strip()}")
          PY
          hit=0
          while IFS='|' read -r today name exp days remind note; do
            echo "· $name：到期 $exp（剩 $days 天，提醒阈 $remind 天）"
            if [ "$days" -le "$remind" ]; then
              hit=$((hit+1))
              TITLE="⚠️ 凭证到期：$name（剩 $days 天，$exp）"
              if gh issue list --state open --search "$TITLE in:title" --json title -q '.[].title' | grep -qF "$TITLE"; then
                echo "  已有未关闭的同类 Issue → 不重复开"
                continue
              fi
              gh issue create --title "$TITLE" --body "$(printf '%s\n' \
                "**到期时间**：$exp（剩 $days 天）" \
                "**说明**：$note" \
                "" \
                "**要做什么**" \
                "1. 重新签发凭证（GitHub → Settings → Developer settings → Tokens）" \
                "2. 更新使用它的地方（仓库 Secrets / 本机归集处）" \
                "3. 更新 \`data/凭证到期.csv\` 里的 \`expires_on\`，然后关掉这个 Issue" \
                "" \
                "> 凭证本体不入库：本机归集处 \`/root/.pi/agent/secrets/INDEX.md\`（目录 700 / 文件 600）")"
              echo "  已开 Issue"
            fi
          done < /tmp/due.txt
          echo "本轮命中 $hit 条"
