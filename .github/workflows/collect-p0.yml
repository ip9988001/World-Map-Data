name: collect-p0

# P0 州级源正式采集：matrix 分片（每个源一个 job）→ 中央合并去重 → 按州切片。
# 采集铁律：分页 = 服务端上限 × 0.9；每主机最小间隔 0.8s；并发 2。
on:
  workflow_dispatch:
    inputs:
      job_file:
        description: "任务文件"
        required: false
        default: "data/p0_jobs.json"
      min_interval:
        description: "每主机最小请求间隔（秒）——不要调小"
        required: false
        default: "0.8"
      chunk_size:
        description: "每块条数（大=少job长job；小=多job短job）"
        required: false
        default: "500000"
      skip_merge:
        description: "只采集不合并（1=跳过合并）"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.gen.outputs.jobs }}
      n: ${{ steps.gen.outputs.n }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成任务矩阵（按 OID 切块，单块 50 万条 ≈4~8 分钟）
        id: gen
        run: |
          python collectors/make_matrix.py "${{ github.event.inputs.job_file }}" >> "$GITHUB_OUTPUT"
        env:
          CHUNK: ${{ github.event.inputs.chunk_size }}

  collect:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 同源各块串行：chunk 之间不并发，保证对同一主机仍满足 ≥0.8s/请求
    concurrency:
      group: wmd-src-${{ matrix.job.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        job: ${{ fromJSON(needs.prepare.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集 ${{ matrix.job.id }} 块${{ matrix.job.k }}（OID ≤ ${{ matrix.job.hi }} / 约 ${{ matrix.job.n }} 条）
        run: |
          python -m collectors.pilot \
            --job-file "${{ github.event.inputs.job_file }}" \
            --job-index ${{ matrix.job.i }} \
            --offset-start 0 \
            --max-records 0 \
            --oid-lo ${{ matrix.job.lo }} \
            --oid-hi ${{ matrix.job.hi }} \
            --min-interval ${{ github.event.inputs.min_interval }} \
            --concurrency 2 \
            --out "out/job_${{ matrix.job.i }}_${{ matrix.job.k }}" \
            --log "out/job_${{ matrix.job.i }}_${{ matrix.job.k }}/request_log.jsonl"

      - name: 打包（丢弃原始层，只留清洗结果）
        if: always()
        run: |
          cd "out/job_${{ matrix.job.i }}_${{ matrix.job.k }}" || exit 0
          rm -rf raw
          gzip -9 -f normalized/*.ndjson 2>/dev/null || true
          ls -la; du -sh .

      - name: 上传本分片
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norm-${{ matrix.job.i }}-${{ matrix.job.k }}
          path: out/job_${{ matrix.job.i }}_${{ matrix.job.k }}/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

  merge:
    needs: [prepare, collect]
    if: ${{ github.event.inputs.skip_merge != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下载全部分片
        uses: actions/download-artifact@v4
        with:
          path: in
          pattern: norm-*
          merge-multiple: true

      # ⛔ 2026-10-12：本步原先调用 collectors/merge_stream.py，已彻底剔除。
      # 该工具假设「输入已按整行排序 + key 是 JSON 首字段」——假设脆弱，破坏后会
      # **静默错误合并**（同地址留多条且不报错）。文件已移入 legacy/collectors/，
      # 合并统一走 scripts/build_release.py 的 TSV 契约（TAB 三列 key/prio/json + `sort -s`）。
      - name: 【已废弃】合并去重（原 merge_stream 路径）
        run: |
          echo "✗ 本步已废弃：collectors/merge_stream.py 已移入 legacy/，不再有任何调用点。"
          echo "  合并请走：python3 scripts/build_release.py --parsed parsed"
          exit 1

      - name: 上传合并结果
        uses: actions/upload-artifact@v4
        with:
          name: merged-p0
          path: out/merged/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
