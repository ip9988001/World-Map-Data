name: collect-chain

# 主动接续采集：单段最多 960 秒，到点自己停并把断点写进 artifact，
# 下一段读断点续采。不依赖 GitHub 托管机赏脸（它会在 20 分钟上下回收长 job）。
on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: "每段最长秒数（默认 960 = 16 分钟）"
        required: false
        default: "960"

permissions:
  contents: read

jobs:
  chain-inA-0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取回已有断点
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: state
          pattern: state-inA-*
          merge-multiple: true

      - name: 定起点（读断点，若该段已完成则跳过）
        id: pos
        run: |
          ls -la state 2>/dev/null || true
          python3 -c "
          import glob, json
          lo, done = 1, False
          for p in glob.glob('state/progress-inA-*.json'):
              try:
                  d = json.load(open(p, encoding='utf-8'))
              except Exception:
                  continue
              done = done or bool(d.get('done'))
              lo = max(lo, int(d.get('last_oid') or 0) + 1)
          print('lo=' + str(lo))
          print('skip=' + ('1' if (done or lo > 1663345) else '0'))
          " >> "$GITHUB_OUTPUT"

      - name: 采集 inA 第 0 段（最多 16 分钟，到点主动停）
        if: steps.pos.outputs.skip != '1'
        run: |
          echo "起点 OID = ${{ steps.pos.outputs.lo }}  上限 = 1663345"
          python -m collectors.pilot \
            --job-file data/retry_jobs.json \
            --job-index 0 \
            --oid-lo ${{ steps.pos.outputs.lo }} \
            --oid-hi 1663345 \
            --max-records 0 \
            --min-interval 1.6 \
            --concurrency 3 \
            --max-seconds ${{ github.event.inputs.max_seconds }} \
            --out out/seg \
            --log out/seg/request_log.jsonl
          echo "--- 断点 ---"; cat out/seg/progress.json

      - name: 打包（丢原始层）
        if: always() && steps.pos.outputs.skip != '1'
        run: |
          cd out/seg || exit 0
          rm -rf raw
          gzip -9 -f normalized/*.ndjson 2>/dev/null || true
          du -sh .

      - name: 上传本段数据
        if: always() && steps.pos.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: seg-inA-0
          path: out/seg/normalized/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: 备好断点文件
        if: always() && steps.pos.outputs.skip != '1'
        run: |
          mkdir -p state
          cp out/seg/progress.json state/progress-inA-0.json || true

      - name: 上传断点（下一段靠它接续）
        if: always() && steps.pos.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: state-inA-0
