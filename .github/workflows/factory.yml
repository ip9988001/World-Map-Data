name: factory（全自动数据工厂 · v2 链路）

# 与旧 collect-*.yml 的区别
#   · 旧：手动触发 + artifact 传断点 + 固定解析逻辑
#   · 本：定时窗口 + 状态回写 data 分支 + 多套规则级联 + 稳定视图发布
#   · 采集语义：下载(bronze) → 本地规则级联(silver) → 分诊；解析失败不重新下载
#   · 公开仓库 standard runner 分钟数免费；单 job 上限 6h，故按泳道并行分片
#
# 触发：
#   定时：每小时 :05（覆盖双窗口，非窗口时段由窗口闸门直接跳过，代价≈1 分钟）
#   手动：gh workflow run factory.yml -f lanes=0,1 -f max_seconds=1200
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      lanes:
        description: "要跑的泳道（all 或 0,1,2）"
        required: false
        default: "all"
      max_seconds:
        description: "每个泳道的秒数预算"
        required: false
        default: "4800"
      mode:
        description: "collect=采集；publish=只合并发布；brain=只造规则"
        required: false
        default: "collect"

permissions:
  contents: write

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  gate:
    # 窗口闸门：北京时间 03-05 / 06-08 / 09-15(欧非) / 12-18(美加) → 换算成 UTC 小时集合
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          H=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，跳过窗口检查" ; echo "go=1" >> "$GITHUB_OUTPUT" ; exit 0
          fi
          WINDOWS="19 20 21 22 23 00 01 02 03 04 05 06 07 08 09 10"
          if echo "$WINDOWS" | tr ' ' '\n' | grep -qx "$H"; then
            echo "窗口内（UTC $H 时）" ; echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "窗口外（UTC $H 时），本轮跳过" ; echo "go=0" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: gate
    if: needs.gate.outputs.go == '1' && (github.event_name == 'schedule' || github.event.inputs.mode == 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      sources: ${{ steps.plan.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 取回上次状态（data 分支）
        run: |
          git fetch origin data --depth=1 || true
          mkdir -p progress data
          git show origin/data:progress/state.json > progress/state.json 2>/dev/null || echo '{}' > progress/state.json
          for f in 源黑名单.csv 引擎路由表.csv; do
            git show "origin/data:data/$f" > "data/$f" 2>/dev/null || true
          done
          python3 -c 'import json; print("state 条目:", len(json.load(open("progress/state.json"))))'
      - name: 生成泳道计划
        id: plan
        run: |
          python -m collectors.plan_batch --lanes 16 --out out/plan.json | tail -2
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          p = json.load(open("out/plan.json"))
          sel = "${{ github.event.inputs.lanes }}".strip()
          alive = [L["lane"] for L in p["lanes"] if L["queue"]]
          if sel and sel not in ("all", ""):
              want = {int(x) for x in sel.split(",") if x.strip().isdigit()}
              alive = [l for l in alive if l in want]
          print("lanes=" + json.dumps(alive))
          print("sources=" + str(sum(len(L["queue"]) for L in p["lanes"] if L["lane"] in alive)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: out/plan.json
          retention-days: 7

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        lane: ${{ fromJson(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装依赖（pyshp：shapefile 类源，缺它→摊平 0 行→误判下载缺陷）
        run: pip install -r requirements.txt || true
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: out
      - name: 取回上次状态（data 分支）
        run: |
          git fetch origin data --depth=1 || true
          mkdir -p progress data
          git show origin/data:progress/state.json > progress/state.json 2>/dev/null || echo '{}' > progress/state.json
          for f in 源黑名单.csv 引擎路由表.csv; do
            git show "origin/data:data/$f" > "data/$f" 2>/dev/null || true
          done
          # 泳道状态必须继承全局状态（否则 artifact 只含本泳道几个源，assemble 会把全局削掉 —— 已踩过：223→1）
          cp -f progress/state.json progress/state-${{ matrix.lane }}.json
      - name: 恢复原始档（bronze：按州 Release 资产，供规则重洗不回源）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATES=$(python scripts/bronze_assets.py states --plan out/plan.json --lane ${{ matrix.lane }})
          echo "本泳道涉及州：$STATES"
          mkdir -p /tmp/bronze
          for st in $STATES; do
            gh release download bronze -p "bronze-$st.zip" -D /tmp/bronze --clobber 2>/dev/null || true
          done
          ls /tmp/bronze | head -5 || true
          python scripts/bronze_assets.py restore --dir /tmp/bronze
      - name: 本泳道采集（下载 → 规则级联 → 分诊）
        run: |
          python -m collectors.pipeline \
            --plan out/plan.json --lane ${{ matrix.lane }} \
            --max-seconds "${{ github.event.inputs.max_seconds || 4800 }}" \
            --per-source-max 600 \
            --state progress/state-${{ matrix.lane }}.json \
            --min-interval 1.0 --concurrency 3
        continue-on-error: true
      - name: 回存原始档（bronze：**并集**回存，单州上限 400MB）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATES=$(python scripts/bronze_assets.py states --plan out/plan.json --lane ${{ matrix.lane }})
          # 关键：先把已存在的 zip 取回来解开再打包 —— 否则后跑完的泳道会拿“只有自己那部分源”的包
          # 覆盖掉别的泳道已存进去的源（实测 bronze-AK.zip 只剩 4 个源、WI 只剩 1 个）
          rm -rf /tmp/bzold /tmp/bronze && mkdir -p /tmp/bzold /tmp/bronze
          for st in $STATES; do
            gh release download bronze -p "bronze-$st.zip" -D /tmp/bzold --clobber 2>/dev/null || true
          done
          python scripts/bronze_assets.py restore --dir /tmp/bzold --archive raw_archive || true
          python scripts/bronze_assets.py pack --states "$(echo $STATES | tr ' ' ',')" --out /tmp/bronze || true
          if ls /tmp/bronze/*.zip >/dev/null 2>&1; then
            gh release create bronze --title "原始档 bronze（按州缓存）" \
              --notes "每州一个 zip；采集前恢复、收工回存（并集），支持规则重洗不回源" 2>/dev/null || true
            # 多泳道并行会同时回存同一个州（实测 HTTP 422 already exists）→ 重试，且失败**不阻断**
            for z in /tmp/bronze/*.zip; do
              for i in 1 2 3; do
                if gh release upload bronze "$z" --clobber 2>/dev/null; then break; fi
                echo "⚠ $(basename "$z") 回存失败（多半是别的泳道同时在传同一个州）→ 重试 $i/3"
                sleep $((i * 8))
              done
            done
            echo "bronze 回存流程完成（失败不阻断本泳道）"
          fi
      - name: 打包本泳道产物（规则产物 + 状态 + 账本）
        if: always()
        run: |
          mkdir -p out/seg
          tar -czf out/seg/parsed-${{ matrix.lane }}.tar.gz -C parsed . 2>/dev/null || true
          du -sh parsed out/seg 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seg-${{ matrix.lane }}
          path: |
            out/seg/parsed-*.tar.gz
            out/triage/*.json
            progress/state-${{ matrix.lane }}.json
            data/源黑名单.csv
            data/引擎路由表.csv
          retention-days: 30
          if-no-files-found: warn

  assemble:
    needs: collect
    # 必须真的跑过 collect 才合并 —— 否则 publish 模式下会把状态覆盖成空（已踩过）
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: seg
      - name: 合并状态分片（以 data 分支既有状态为底，同源取 updated 最新者）
        run: |
          mkdir -p /tmp/asm/progress
          git fetch origin data --depth=1 || true
          git show origin/data:progress/state.json > /tmp/asm/progress/base.json 2>/dev/null || echo '{}' > /tmp/asm/progress/base.json
          python3 - <<'PY'
          import glob, json
          base = json.load(open("/tmp/asm/progress/base.json", encoding="utf-8"))
          merged = dict(base)
          for p in glob.glob("seg/**/state-*.json", recursive=True):
              try:
                  d = json.load(open(p, encoding="utf-8"))
              except Exception:
                  continue
              for sid, v in d.items():
                  prev = merged.get(sid)
                  if prev is None or (v.get("updated") or "") >= (prev.get("updated") or ""):
                      merged[sid] = v
          # 防缩水护栏：合并只可能变多。若比底稿少，说明有人把状态覆盖坏了 —— 拒绝写入并报错。
          if len(merged) < len(base):
              raise SystemExit(f"❌ 状态缩水：底稿 {len(base)} 源 → 合并后 {len(merged)} 源，拒绝写入")
          json.dump(merged, open("/tmp/asm/progress/state.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1, sort_keys=True)
          done = [v for v in merged.values() if v.get("done")]
          print(f"合并状态：{len(merged)} 源（底稿 {len(base)}）｜完成 {len(done)}｜"
                f"洗出 {sum(v.get('kept') or 0 for v in done):,} 条")
          PY
      - name: 合并账本（黑名单 / 路由表）
        run: |
          python3 - <<'PY'
          import csv, glob, os
          os.makedirs("/tmp/asm/data", exist_ok=True)
          # 黑名单：按 source_id 去重（保留条目即拉黑）
          bl = {}
          for p in glob.glob("seg/**/源黑名单.csv", recursive=True) + ["data/源黑名单.csv"]:
              if not os.path.exists(p):
                  continue
              for r in csv.DictReader(open(p, encoding="utf-8-sig")):
                  if r.get("source_id"):
                      bl[r["source_id"]] = r
          if bl:
              cols = list(next(iter(bl.values())).keys())
              with open("/tmp/asm/data/源黑名单.csv", "w", encoding="utf-8", newline="") as fh:
                  w = csv.DictWriter(fh, fieldnames=cols, extrasaction="ignore")
                  w.writeheader(); w.writerows(bl.values())
          # 路由表：按 (source_id, engine) 取 wins/losses 最大
          rt = {}
          for p in glob.glob("seg/**/引擎路由表.csv", recursive=True) + ["data/引擎路由表.csv"]:
              if not os.path.exists(p):
                  continue
              for r in csv.DictReader(open(p, encoding="utf-8-sig")):
                  k = (r.get("source_id"), r.get("engine"))
                  if not k[0]:
                      continue
                  cur = rt.get(k)
                  if cur is None or int(r.get("wins") or 0) >= int(cur.get("wins") or 0):
                      rt[k] = r
          if rt:
              cols = list(next(iter(rt.values())).keys())
              with open("/tmp/asm/data/引擎路由表.csv", "w", encoding="utf-8", newline="") as fh:
                  w = csv.DictWriter(fh, fieldnames=cols, extrasaction="ignore")
                  w.writeheader(); w.writerows(rt.values())
          print(f"账本合并：黑名单 {len(bl)}｜路由 {len(rt)}")
          PY
      - name: 汇总待造刀清单（缺口源 → data 分支，供 AI 造规则）
        run: |
          mkdir -p /tmp/asm/待造刀
          n=0
          for f in $(find seg -name '待造刀-*.json' 2>/dev/null); do
            cp -f "$f" /tmp/asm/待造刀/ 2>/dev/null && n=$((n+1)) || true
          done
          echo "待造刀清单 $n 份"
      - name: 合并规则产物
        run: |
          mkdir -p /tmp/asm/parsed
          for f in $(find seg -name "parsed-*.tar.gz"); do [ -f "$f" ] && tar -xzf "$f" -C /tmp/asm/parsed; done
          find /tmp/asm/parsed -name '*.ndjson' | wc -l
      - name: 回写状态与账本到 data 分支
        run: |
          git config user.name "factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git fetch origin data --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          mkdir -p progress data progress/待造刀
          cp /tmp/asm/progress/state.json progress/state.json
          cp -f /tmp/asm/data/*.csv data/ 2>/dev/null || true
          cp -f /tmp/asm/待造刀/*.json progress/待造刀/ 2>/dev/null || true
          git add -f progress/state.json "data/源黑名单.csv" "data/引擎路由表.csv" 2>/dev/null || true
          git add -f progress/待造刀 2>/dev/null || true
          git commit -m "state: 采集状态回写（run ${{ github.run_id }}）" || echo "无状态变化"
          git push -f origin data
      - name: 规则产物缓存到 Release（cache-parsed，保留 5 份）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          ( cd /tmp/asm && tar -czf parsed-$STAMP.tar.gz -C parsed . ) 2>/dev/null || true
          if [ -s /tmp/asm/parsed-$STAMP.tar.gz ]; then
            gh release create cache-parsed --title "规则产物缓存" \
              --notes "各窗口 parsed 快照，保留最近 5 份" 2>/dev/null || true
            gh release upload cache-parsed /tmp/asm/parsed-$STAMP.tar.gz --clobber
            gh release view cache-parsed --json assets -q '.assets[].name' | sort -r | tail -n +6 | \
              while read -r n; do gh release delete-asset cache-parsed "$n" -y || true; done
          fi

  brain:
    # AI 造规则：缺口源 → 从 bronze 取真实样本 → LLM 写声明式规格 → 验证闸门 → 推 main
    needs: assemble
    if: always() && needs.assemble.result != 'cancelled' && (github.event_name == 'schedule' || github.event.inputs.mode == 'brain')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt || true
      - name: 取回待造刀清单（data 分支）
        run: |
          git fetch origin data --depth=1 || true
          mkdir -p progress/待造刀 out
          # 必须用 git archive（中文路径）：ls-tree 默认会输出引号转义路径，
          # 之前的写法 git show "origin/data:$f" 全失败，只留下 7 个空文件 → brain 以为“无缺口”
          git archive origin/data progress/待造刀 2>/dev/null | tar -x -C . 2>/dev/null || true
          python3 - <<'PY'
          import glob, json
          ok = 0
          for f in glob.glob("progress/待造刀/*.json"):
              try:
                  json.load(open(f, encoding="utf-8"))
                  ok += 1
              except Exception:
                  print("⚠ 读不动的清单（当空处理）:", f)
          print("可用待造刀清单:", ok)
          PY
      - name: 恢复原始档（bronze：造规则要真实样本，不回源）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATES=$(python3 - <<'PY'
          import glob, json
          sts = set()
          for f in glob.glob("progress/待造刀/*.json"):
              try:
                  sid = json.load(open(f, encoding="utf-8")).get("source_id", "")
              except Exception:
                  continue
              if "/" in sid:
                  sts.add(sid.split("/")[1].upper())
          print(" ".join(sorted(sts)))
          PY
          )
          echo "涉及州：$STATES"
          mkdir -p /tmp/bronze
          for st in $STATES; do
            gh release download bronze -p "bronze-$st.zip" -D /tmp/bronze --clobber 2>/dev/null || true
          done
          python scripts/bronze_assets.py restore --dir /tmp/bronze
      - name: AI 造规则（LLM → 验证闸门 → specs/）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BRAIN_MODEL: deepseek-flash
        run: |
          python -m collectors.rule_author --gap-dir progress/待造刀 --archive raw_archive \
            --out collectors/rules/specs --max-sources 8 --budget-seconds 2100
      - name: 规则自检（新规格必须能加载 + 样例通过）
        run: python -c "from collectors.rules import self_test_all; import json; print(json.dumps(self_test_all(), ensure_ascii=False, indent=1))"
      - name: 推回 main（只推规则与账本）
        run: |
          git config user.name "factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git add -A collectors/rules/specs data/造规则账本.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "本轮无新规则"; exit 0; fi
          git commit -m "rule: AI 造规则（run ${{ github.run_id }}）"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "推送失败"; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brain-report
          path: out/brain/报告.md
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: assemble
    # publish 独立于 assemble：publish 模式没有 collect，assemble 会被跳过（skipped≠失败）
    if: always() && needs.assemble.result != 'cancelled' && (github.event_name == 'schedule' || github.event.inputs.mode == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 发布节拍闸门（每天一次整包发布，手动触发不受限）
        id: cadence
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动发布，跳过节拍检查" ; echo "go=1" >> "$GITHUB_OUTPUT" ; exit 0
          fi
          H=$(date -u +%H)
          if [ "$H" = "11" ]; then
            echo "到达每日发布点（UTC 11 时 = 北京 19 时）" ; echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "非发布点（UTC $H 时）→ 本小时只采集不发布" ; echo "go=0" >> "$GITHUB_OUTPUT"
          fi
      - name: 取回规则产物缓存（最近一份）
        if: steps.cadence.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p parsed /tmp/cache
          gh release download cache-parsed -p '*.tar.gz' -D /tmp/cache 2>/dev/null || true
          last=$(ls -t /tmp/cache/*.tar.gz 2>/dev/null | head -1)
          if [ -n "$last" ]; then tar -xzf "$last" -C parsed; fi
          find parsed -name '*.ndjson' | wc -l
      - name: 取回旧分片（上一版稳定视图，作为合并底稿）
        if: steps.cadence.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/final3
          gh release download v0.1.0-dataset -p '[A-Z][A-Z].ndjson.gz' -D out/final3 --clobber 2>/dev/null || true
          ls out/final3 | wc -l
      - name: 构建发布包（按 key 去重，新数据优先）
        if: steps.cadence.outputs.go == '1'
        run: |
          python scripts/build_release.py || echo "（无可发布内容）"
      - name: 取回状态（校验闸门用）
        if: steps.cadence.outputs.go == '1'
        run: |
          git fetch origin data --depth=1 || true
          mkdir -p progress parsed
          git show origin/data:progress/state.json > progress/state.json 2>/dev/null || echo '{}' > progress/state.json
      - name: 校验闸门（schema + 溯源 + 防缩水；不过不发）
        if: steps.cadence.outputs.go == '1'
        run: |
          if [ ! -d out/release ]; then echo "无发布内容，跳过校验"; exit 0; fi
          python scripts/verify_release.py --release out/release --parsed parsed \
            --state progress/state.json --min-rows 20000000 --sample-sources 3
      - name: 回写发布清单到 main（发布收据：行数 + sha256，供对账）
        if: steps.cadence.outputs.go == '1'
        run: |
          git config user.name "factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git add -f data/release-manifest.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "清单无变化"; exit 0; fi
          git commit -m "release: 发布清单回写（run ${{ github.run_id }}）"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "清单推送失败（不阻断发布）"
      - name: 上传稳定视图（tag 复用 + --clobber）
        if: steps.cadence.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d out/release ] || exit 0
          gh release create v0.1.0-dataset --title "地址数据集（稳定视图）" \
            --notes "按州分片稳定视图；tag 永久复用，更新=删旧资产+同名重传" 2>/dev/null || true
          for f in out/release/*.ndjson.gz; do gh release upload v0.1.0-dataset "$f" --clobber; done
          python3 - <<'PY'
          import json, subprocess
          m = json.load(open("data/release-manifest.json", encoding="utf-8"))
          rows = m.get("rows", 0)
          subprocess.run(["gh", "release", "edit", "v0.1.0-dataset",
                          "--title", f"地址数据集（{rows:,} 条真实门牌点稳定视图）"], check=False)
          PY
      - name: 完整快照（full-*，保留 10 份）
        if: steps.cadence.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f out/release/merged.clean.ndjson.gz ] || exit 0
          TAG="full-$(date -u +%Y%m%d)"
          gh release create "$TAG" --title "full 快照 $TAG" --notes "完整快照，保留最近 10 份" 2>/dev/null || true
          gh release upload "$TAG" out/release/merged.clean.ndjson.gz --clobber
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^full-' | sort -r | \
            tail -n +11 | while read -r t; do gh release delete "$t" -y --cleanup-tag || true; done
